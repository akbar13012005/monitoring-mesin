<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Teknobro Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f0d;
    --surface: #101714;
    --surface-raised: #161f1b;
    --border: #223029;
    --border-bright: #2d4a3e;
    --cyan: #22d3ee;
    --cyan-dim: #22d3ee40;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --text: #e7f0ec;
    --text-muted: #7d8f86;
    --text-dim: #4c5c54;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    position: relative;
    padding: 20px 20px 60px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -10%;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: 0.10;
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 26px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px;
    border: 1.5px solid var(--cyan);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .brand-name span { color: var(--cyan); }
  .brand-sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 1px; }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .live-pill {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px 6px 10px;
    font-size: 0.78rem;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .live-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  @media (prefers-reduced-motion: no-preference) {
    .live-dot.on { animation: pulseDot 1.8s ease-in-out infinite; }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .live-dot.off { background: var(--red); }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .logout-btn:hover { border-color: var(--border-bright); color: var(--text); }

  /* ---------- signature bezel (dipakai di semua kartu) ---------- */
  .bezel { position: relative; }
  .bezel .corner {
    position: absolute; width: 14px; height: 14px;
    border-color: var(--cyan); opacity: 0.5; pointer-events: none;
  }
  .bezel .corner.tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; border-top-left-radius: 7px; }
  .bezel .corner.tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; border-top-right-radius: 7px; }
  .bezel .corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; border-bottom-left-radius: 7px; }
  .bezel .corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; border-bottom-right-radius: 7px; }

  /* ---------- kartu gauge utama ---------- */
  .gauge-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 460px) { .gauge-grid { grid-template-columns: 1fr; } }

  .gauge-card {
    background: linear-gradient(180deg, var(--surface), var(--surface-raised));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
  }
  .gauge-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-dot.green { background: var(--green); box-shadow: 0 0 5px var(--green); }
  .status-dot.amber { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
  .status-dot.red   { background: var(--red);   box-shadow: 0 0 5px var(--red); }

  .gauge-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 2rem;
    margin-top: 10px;
    display: flex;
    align-items: baseline;
    gap: 6px;
    transition: opacity 0.15s ease;
  }
  .gauge-value .unit {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-muted);
  }
  .gauge-value.flash { animation: flashUpdate 0.5s ease; }
  @keyframes flashUpdate {
    0% { color: var(--cyan); }
    100% { color: var(--text); }
  }

  .vibe-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    margin-bottom: 26px;
    font-size: 0.82rem;
  }
  .vibe-row .left { display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
  .vibe-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .vibe-badge.active { background: #4ade8022; color: var(--green); border: 1px solid #4ade8055; }
  .vibe-badge.idle   { background: #ffffff0a; color: var(--text-dim); border: 1px solid var(--border); }

  /* ---------- section: kapasitas & efisiensi ---------- */
  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    margin: 30px 0 12px;
    color: var(--text);
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 700px) { .result-grid { grid-template-columns: 1fr; } }

  .result-card {
    background: linear-gradient(180deg, var(--surface), var(--surface-raised));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .result-card h3 {
    margin: 0 0 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
  }
  .result-rows { display: flex; flex-direction: column; gap: 10px; }
  .result-row { display: flex; align-items: baseline; justify-content: space-between; }
  .result-row .k { font-size: 0.78rem; color: var(--text-muted); }
  .result-row .v { font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; font-weight: 700; }
  .formula {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.7;
  }


  /* ---------- footer ---------- */
  .footer {
    margin-top: 44px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .footer .tekno { color: var(--cyan); font-weight: 600; }
  .footer .bro { color: #ffffff; font-weight: 600; }

  /* ---------- mobile optimization ---------- */
  @media (max-width: 600px) {
    body { padding: 14px 12px 36px; }
    .wrap { width: 100%; }
    .topbar { align-items: flex-start; margin-bottom: 18px; gap: 10px; }
    .brand { min-width: 0; }
    .brand-name { font-size: 0.95rem; }
    .brand-sub { font-size: 0.68rem; }
    .topbar-right { width: auto; margin-left: auto; justify-content: flex-end; gap: 8px; }
    .live-pill { min-width: 0; padding: 7px 10px; font-size: 0.72rem; }
    .logout-btn { padding: 7px 11px; font-size: 0.72rem; }
    .gauge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 10px; }
    .gauge-card { padding: 14px 12px 13px; min-width: 0; }
    .gauge-label { font-size: 0.62rem; }
    .gauge-value { font-size: clamp(1.35rem, 8vw, 1.8rem); margin-top: 8px; gap: 4px; white-space: nowrap; }
    .gauge-value .unit { font-size: 0.68rem; }
    .vibe-row { padding: 10px 12px; margin-bottom: 20px; font-size: 0.72rem; }
    .vibe-badge { font-size: 0.65rem; padding: 4px 8px; }
    .section-title { font-size: 0.88rem; margin: 22px 0 10px; }
    .result-grid { grid-template-columns: 1fr; gap: 9px; }
    .result-card { padding: 15px; }
    .result-card h3 { font-size: 0.82rem; margin-bottom: 12px; }
    .result-row .k { font-size: 0.7rem; }
    .result-row .v { font-size: 0.9rem; }
    .formula { font-size: 0.64rem; }
  }

  @media (max-width: 360px) {
    body { padding-left: 9px; padding-right: 9px; }
    .gauge-grid { gap: 7px; }
    .gauge-card { padding-left: 10px; padding-right: 10px; }
    .gauge-value { font-size: 1.25rem; }
    .gauge-value .unit { font-size: 0.62rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="13" rx="1.5"/>
            <path d="M8 20h8M12 17v3"/>
            <path d="M6.5 13l2.5-4 2 3 2.5-5 2.5 3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Monitoring Mesin Pencacah</div>
          <div class="brand-sub">Teknik Industri ITERA</div>
        </div>
      </div>

      <div class="topbar-right">
        <div class="live-pill">
          <span class="live-dot" id="liveDot"></span>
          <span id="liveText">Menghubungkan...</span>
        </div>
      </div>
    </div>

    <div class="gauge-grid">
      <div class="gauge-card bezel">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="gauge-label">Berat<span class="status-dot green" id="dotBerat"></span></div>
        <div class="gauge-value" id="valBerat">-<span class="unit">kg</span></div>
      </div>
      <div class="gauge-card bezel">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="gauge-label">Putaran<span class="status-dot green" id="dotRpm"></span></div>
        <div class="gauge-value" id="valRpm">-<span class="unit">RPM</span></div>
      </div>
    </div>

    <div class="vibe-row">
      <div class="left">Status Getaran</div>
      <span class="vibe-badge idle" id="vibeBadge">TIDAK AKTIF</span>
    </div>

    <div class="section-title">Sesi Terakhir</div>
    <div class="result-grid">
      <div class="result-card">
        <h3>Kapasitas Mesin</h3>
        <div class="result-rows">
          <div class="result-row"><span class="k">Cc (Kapasitas)</span><span class="v" id="valMc">- g/s</span></div>
          <div class="result-row"><span class="k">Wt (berat awal)</span><span class="v" id="valWt">- g</span></div>
          <div class="result-row"><span class="k">T (durasi)</span><span class="v" id="valT">- s</span></div>
        </div>
      </div>
      <div class="result-card">
        <h3>Efisiensi</h3>
        <div class="result-rows">
          <div class="result-row"><span class="k">Efisiensi Chopper (ηc)</span><span class="v" id="valEtaC">- %</span></div>
          <div class="result-row"><span class="k">Bahan Terpotong (ηoc)</span><span class="v" id="valEtaOC">- %</span></div>
        </div>
      </div>
    </div>

    <div class="footer">Powered by <span class="tekno">tekno</span><span class="bro">bro.id</span></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // ---------- Konfigurasi Firebase (project sama dengan test-monitoring.html) ----------
    const firebaseConfig = {
      apiKey: "AIzaSyAh0M-yjU6GiOmwAhmFdByQtq0CHauCU9M",
      authDomain: "monitoring-mesin-pencacah1.firebaseapp.com",
      databaseURL: "https://monitoring-mesin-pencacah1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "monitoring-mesin-pencacah1",
      storageBucket: "monitoring-mesin-pencacah1.firebasestorage.app",
      messagingSenderId: "214067885576",
      appId: "1:214067885576:web:0990d6571377e1ae25c3bd"
    };

    const FRESHNESS_LIMIT_SEC = 10;   // ESP32 kirim tiap 2 detik - lebih dari ini dianggap terputus

    // 1 kalau ESP32 kirim Wt dalam kg, 1000 kalau dikirim dalam gram
    const WT_DIVISOR = 1;

    const liveDot = document.getElementById("liveDot");
    const liveText = document.getElementById("liveText");

    function setLive(state, text) {
      liveDot.className = "live-dot " + state;
      liveText.textContent = text;
    }

    function flashValue(el, text) {
      el.firstChild.textContent = text;
      el.classList.remove("flash");
      void el.offsetWidth;   // trigger reflow biar animasinya bisa diulang
      el.classList.add("flash");
    }

    // kondisi tidak ada data / terputus: semua status merah, semua nilai jadi 0
    function setDisconnected(text) {
      setLive("off", text);
      ["dotBerat", "dotRpm"].forEach((id) => {
        document.getElementById(id).className = "status-dot red";
      });
      ["valBerat", "valRpm"].forEach((id) => {
        const el = document.getElementById(id);
        el.firstChild.textContent = "0";
        el.classList.remove("flash");
      });
      document.getElementById("valMc").textContent = "0 g/s";
      document.getElementById("valWt").textContent = "0 g";
      document.getElementById("valT").textContent = "0 s";
      document.getElementById("valEtaC").textContent = "0 %";
      document.getElementById("valEtaOC").textContent = "0 %";
      const vibeBadge = document.getElementById("vibeBadge");
      vibeBadge.textContent = "TIDAK AKTIF";
      vibeBadge.className = "vibe-badge idle";
    }

    let lastEpoch = 0;
    let receivedAny = false;
    const startEpoch = Math.floor(Date.now() / 1000);

    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const monitoringRef = db.ref("monitoring");

      monitoringRef.on(
        "value",
        (snapshot) => {
          const data = snapshot.val();
          if (!data) {
            setDisconnected("Data kosong");
            return;
          }

          lastEpoch = Number(data.lastUpdate) || 0;
          receivedAny = true;

          // data lama yang masih nyangkut di Firebase dianggap tidak ada data
          if (lastEpoch > 0 && Math.floor(Date.now() / 1000) - lastEpoch > FRESHNESS_LIMIT_SEC) {
            setDisconnected("Terputus");
            return;
          }

          flashValue(document.getElementById("valBerat"), (data.berat ?? "-"));
          flashValue(document.getElementById("valRpm"), (data.rpm ?? "-"));

          document.getElementById("dotBerat").className = "status-dot green";
          document.getElementById("dotRpm").className = "status-dot green";

          const vibeBadge = document.getElementById("vibeBadge");
          if (data.getaran) {
            vibeBadge.textContent = "AKTIF";
            vibeBadge.className = "vibe-badge active";
          } else {
            vibeBadge.textContent = "TIDAK AKTIF";
            vibeBadge.className = "vibe-badge idle";
          }

          // ---------- Kapasitas: Cc = (3.6 x 10^3 x Wt) / T  -> kg/jam ----------
          const kap = data.kapasitas || {};
          const wtKg = Number(kap.wt) / WT_DIVISOR;
          const T = Number(kap.t);
          const cc = (T > 0 && isFinite(wtKg)) ? (3.6e3 * wtKg) / T : null;

          document.getElementById("valMc").textContent = cc !== null ? cc.toFixed(2) + " g/s" : "- g/s";
          document.getElementById("valWt").textContent = isFinite(wtKg) ? (wtKg * WT_DIVISOR).toFixed(3) + " g" : "- g";
          document.getElementById("valT").textContent  = T > 0 ? T.toFixed(2) + " s" : "- s";

          const eff = data.efisiensi || {};
          document.getElementById("valEtaC").textContent = (eff.etaC ?? "-") + " %";
          document.getElementById("valEtaOC").textContent = (eff.etaOC ?? "-") + " %";
        },
        (error) => {
          setDisconnected("Gagal membaca data");
        }
      );
    } catch (err) {
      setDisconnected("Koneksi terputus");
    }

    // cek kesegaran data tiap detik - biar status "Live" beneran nyerminin
    // ESP32 masih ngirim, bukan cuma socket Firebase-nya yang masih nyambung
    setInterval(() => {
      const nowEpoch = Math.floor(Date.now() / 1000);
      if (lastEpoch === 0) {
        // belum pernah ada data sama sekali setelah halaman dibuka
        if (!receivedAny && nowEpoch - startEpoch > FRESHNESS_LIMIT_SEC) {
          setDisconnected("Terputus");
        }
        return;
      }
      if (nowEpoch - lastEpoch > FRESHNESS_LIMIT_SEC) {
        setDisconnected("Terputus");
      } else {
        setLive("on", "Live");
      }
    }, 1000);
  </script>
</body>
</html>
